[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
# 内部
rstore-common    = { path = "crates/common" }
rstore-checksum  = { path = "crates/checksum" }
rstore-erasure   = { path = "crates/erasure" }
rstore-meta      = { path = "crates/meta" }
rstore-disk      = { path = "crates/disk" }
rstore-store     = { path = "crates/store" }
rstore-api       = { path = "crates/api" }
rstore-s3        = { path = "crates/s3" }
rstore-s3-compat = { path = "crates/s3-compat" }
# 身份与访问管理。**叶子 crate，不依赖任何其他 rstore-***：动作名与资源名
# 都只是 &str，所以策略引擎的单测不需要起 HTTP。
rstore-iam       = { path = "crates/iam" }

# 外部
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1"
blake3 = "1"
md-5 = "0.10"
crc32c = "0.6"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reed-solomon-simd = "3"
proptest = "1"
tempfile = "3"
futures = "0.3"
async-trait = "0.1"
lru = "0.12"
s3s = "0.17"
# 测试要用的 HTTP/tower 工具（examples 与集成测试里直接用 oneshot 打请求）。
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
jiff = "0.2"
clap = { version = "4", features = ["derive"] }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
