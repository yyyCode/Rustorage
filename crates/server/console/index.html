<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustorage Console</title>
<!-- 资源一律用**绝对路径**：index.html 同时服务在 `/_console` 与 `/_console/` 上，
     用相对路径时前者会把 `style.css` 解析成 `/style.css`。 -->
<link rel="stylesheet" href="/_console/style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">Rustorage</span>
  <nav id="nav" class="nav"></nav>
  <span id="conn" class="conn"></span>
</header>
<main id="view" class="view"></main>
<!-- 没有内联脚本：CSP 是 `default-src 'self'`，内联 script 会被浏览器直接拒掉。
     页面里的所有事件绑定都在 app.js 里用 addEventListener 完成。 -->
<script type="module" src="/_console/app.js"></script>
</body>
</html>
