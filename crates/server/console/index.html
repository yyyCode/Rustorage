<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustorage Console</title>
<!-- 资源一律用**绝对路径**：index.html 同时服务在 `/_console` 与 `/_console/` 上，
     用相对路径时前者会把 `style.css` 解析成 `/style.css`。 -->
<link rel="stylesheet" href="/_console/style.css">
</head>
<!-- 布局：左侧固定侧栏（导航 + 桶列表 + 连接状态），右侧主区。
     登录前由 app.js 把 body 的 data-state 置为 `anon`，样式据此收起侧栏并让登录卡片居中。 -->
<body data-state="anon">
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">RS</span>
      <span class="brand-text">Rustorage<em>Console</em></span>
    </div>
    <nav id="nav" class="side-nav"></nav>
    <div class="side-group">
      <p class="side-label">桶</p>
      <div id="buckets" class="side-buckets"></div>
    </div>
    <div class="side-foot">
      <span id="conn" class="conn"></span>
      <button id="logout" class="link-btn" type="button">退出登录</button>
    </div>
  </aside>
  <main id="view" class="content"></main>
</div>
<!-- 没有内联脚本：CSP 是 `default-src 'self'`，内联 script 会被浏览器直接拒掉。
     页面里的所有事件绑定都在 app.js 里用 addEventListener 完成。 -->
<script type="module" src="/_console/app.js"></script>
</body>
</html>
