[package]
name = "rstore-store"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rstore-common.workspace = true
rstore-checksum.workspace = true
rstore-erasure.workspace = true
rstore-meta.workspace = true
rstore-disk.workspace = true
md-5.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `testutil::RecordingDisk` 要 `#[async_trait::async_trait]` 实现 `DiskAPI`。
# 只在测试夹具里需要，所以是 dev-dependency。
async-trait.workspace = true
# `FaultyDisk` 在 rstore-disk 里由 `any(test, feature = "fault-injection")` 门控：
# store 的测试是独立编译的 crate，rstore-disk 的 `cfg(test)` 在那里不生效，
# 必须显式开这个 feature 才能看到故障注入盘。
rstore-disk = { workspace = true, features = ["fault-injection"] }

[lints]
workspace = true
