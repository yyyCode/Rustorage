[package]
name = "rstore-s3"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rstore-api.workspace = true
rstore-common.workspace = true
s3s.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
# s3s 不公开 re-export `http`（`s3s::http` 是私有模块），而实现层要自己造响应头：
# 416 的 `Content-Range`、503 的 `Retry-After`、304 的 `ETag`/`Last-Modified`
# 都是用 `http::HeaderMap` / `HeaderValue` 经 `S3Error::set_headers` 挂上去的。
# （**不是因为 `S3Response::with_status`**——那条路径上它是空操作，见 Task 5.10。）
http.workspace = true
# `mock.rs` 在 `src/` 里，要 `AsyncReadExt::read_to_end` 读干请求体——
# 于是 tokio 从 dev-dependency 升为**正式依赖**。
tokio.workspace = true
# `StreamReader` 把 `StreamingBlob` 转成 `AsyncRead`。**必须显式写 `io`**：
# workspace 里声明的是 `features = ["rt"]`，而 tokio-util 0.7 的 `default = []`，
# 不写这一条 `tokio_util::io` 整个模块都不存在。
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
# 时间戳：认证测试要用「当前 UTC 时间」签 SigV4（默认时钟偏移容忍 900s），
# 手工做 civil-date 换算没有必要。jiff 已经是 s3s-sigv4 的依赖。
jiff.workspace = true
# SigV4 签名工具（`s3s` 的直接依赖，但**没有**公开 re-export；
# s3s 只 re-export 了 `AmzDate` 与 `AuthorizationV4` 的 fuzzing 门控项）。
# 认证测试需要它来**生成**请求——用被测代码的不同一条路径签字，才算真的在测校验。
s3s-sigv4 = "0.17"
# 算请求体的 SHA256（SigV4 的 `x-amz-content-sha256`）。**必须是 0.11**：
# `Cargo.lock` 里已经有 `sha2 0.11.0`（s3s-sigv4 的依赖），写 0.10 会让锁文件里
# 同时存在两份 sha2 + 两份 digest，白涨编译时间。
sha2 = "0.11"

[lints]
workspace = true
